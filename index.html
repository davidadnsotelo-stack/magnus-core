<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Magnus — Core AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-dim: #8a6f2e;
    --gold-bright: #f0c96a;
    --bg: #080809;
    --bg2: #0f0f11;
    --bg3: #161618;
    --surface: #121214;
    --border: rgba(201,168,76,0.15);
    --border-bright: rgba(201,168,76,0.45);
    --text: #e8e4d8;
    --text-dim: #6a6458;
    --text-muted: #2e2c27;
    --success: #2ecc71;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    height: -webkit-fill-available;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
  }

  /* ── GRID BG ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(201,168,76,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── GLOW ── */
  .glow-orb {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    transition: all 2s ease;
  }
  .glow-orb.active {
    background: radial-gradient(circle, rgba(201,168,76,0.10) 0%, transparent 70%);
    animation: pulse-orb 4s ease-in-out infinite;
  }
  @keyframes pulse-orb {
    0%,100%{opacity:1;transform:translateX(-50%) scale(1)}
    50%{opacity:0.6;transform:translateX(-50%) scale(1.2)}
  }

  /* ── APP SHELL — mobile-first fixed layout ── */
  #app {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: none;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,8,9,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .lion-icon {
    font-size: 22px;
    line-height: 1;
    filter: drop-shadow(0 0 8px rgba(201,168,76,0.5));
  }
  .logo {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 4px;
  }
  .logo-sub {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2.5px;
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    margin-top: 2px;
  }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: all 0.4s;
    flex-shrink: 0;
  }
  .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .status-dot.listening { background: var(--gold); box-shadow: 0 0 12px var(--gold); animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.2} }
  .status-label { font-size: 10px; color: var(--text-dim); letter-spacing: 1.5px; text-transform: uppercase; }
  #voice-wave { display:none; align-items:center; gap:3px; height:20px; }
  #voice-wave.show { display:flex; }
  .wave-bar { width:3px; border-radius:2px; background:var(--gold); animation:wave 0.8s ease-in-out infinite; }
  .wave-bar:nth-child(1){height:6px;animation-delay:0s}
  .wave-bar:nth-child(2){height:14px;animation-delay:0.1s}
  .wave-bar:nth-child(3){height:20px;animation-delay:0.2s}
  .wave-bar:nth-child(4){height:12px;animation-delay:0.3s}
  .wave-bar:nth-child(5){height:6px;animation-delay:0.4s}
  @keyframes wave{0%,100%{transform:scaleY(0.3);opacity:0.4}50%{transform:scaleY(1);opacity:1}}

  /* ── TOOLS STRIP ── */
  .tools-strip {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,8,9,0.7);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tools-strip::-webkit-scrollbar { display: none; }
  .tool-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 10px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    background: transparent;
    flex-shrink: 0;
  }
  .tool-pill.connected { border-color: rgba(201,168,76,0.35); color: var(--gold-dim); }
  .tool-pill.connected .pill-dot { background: var(--gold); box-shadow: 0 0 5px var(--gold); }
  .pill-dot { width:5px; height:5px; border-radius:50%; background:var(--text-muted); flex-shrink:0; }

  /* ── CHAT AREA ── */
  #chat-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--text-muted) transparent;
  }

  /* ── MESSAGES ── */
  .msg { display:flex; gap:10px; animation:msg-in 0.25s ease; max-width:100%; }
  @keyframes msg-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .msg.user { flex-direction:row-reverse; align-self:flex-end; max-width:85%; }
  .msg.magnus { max-width:92%; }
  .msg-avatar {
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; flex-shrink:0; margin-top:2px;
  }
  .msg.magnus .msg-avatar {
    background: linear-gradient(135deg, #1a1508, #2e2410);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-size: 14px;
  }
  .msg.user .msg-avatar {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 10px;
  }
  .msg-content { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .msg-label { font-size:9px; color:var(--text-muted); letter-spacing:1.5px; text-transform:uppercase; }
  .msg.magnus .msg-label { color:var(--gold-dim); }
  .msg.user .msg-label { text-align:right; }
  .msg-bubble {
    padding: 12px 15px;
    border-radius: var(--radius);
    font-size: 13.5px;
    line-height: 1.65;
    word-break: break-word;
  }
  .msg.magnus .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-top-left-radius: 4px;
  }
  .msg.user .msg-bubble {
    background: linear-gradient(135deg, #1a1508, #221c08);
    border: 1px solid rgba(201,168,76,0.2);
    color: var(--text);
    border-top-right-radius: 4px;
    text-align: right;
  }

  /* typing */
  .typing-indicator .msg-bubble { display:flex; gap:5px; align-items:center; padding:14px 18px; }
  .typing-dot { width:6px; height:6px; border-radius:50%; background:var(--gold-dim); animation:typing 1.2s infinite; }
  .typing-dot:nth-child(2){animation-delay:0.2s}
  .typing-dot:nth-child(3){animation-delay:0.4s}
  @keyframes typing{0%,60%,100%{opacity:0.3;transform:scale(1)}30%{opacity:1;transform:scale(1.3)}}

  /* ── INPUT BAR — fixed at bottom, handles keyboard ── */
  #input-bar {
    flex-shrink: 0;
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: rgba(8,8,9,0.96);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .quick-actions {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .quick-actions::-webkit-scrollbar { display:none; }
  .quick-btn {
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: transparent;
    color: var(--text-dim);
    font-size: 10px;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Inter', sans-serif;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .quick-btn:active { border-color: var(--border-bright); color: var(--gold); }
  .input-row { display:flex; gap:8px; align-items:flex-end; }
  #msg-input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 300;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    overflow-y: auto;
    line-height: 1.4;
    -webkit-appearance: none;
    transition: border-color 0.2s;
  }
  #msg-input::placeholder { color: var(--text-muted); }
  #msg-input:focus { border-color: rgba(201,168,76,0.3); }
  .btn-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 17px;
    transition: all 0.2s;
    -webkit-appearance: none;
  }
  .btn-icon:active { border-color: var(--border-bright); color: var(--gold); }
  .btn-icon.active { background: var(--gold); border-color: var(--gold); color: #0a0a0b; }
  #btn-send {
    background: linear-gradient(135deg, #1a1508, #2e2410);
    border-color: var(--gold-dim);
    color: var(--gold);
  }
  #btn-send:active { background: linear-gradient(135deg, #2e2410, #3d3015); border-color: var(--gold); }

  /* ── MODAL ── */
  #api-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(12px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-box {
    background: var(--bg2);
    border: 1px solid var(--border-bright);
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 400px;
    width: 100%;
    animation: modal-in 0.3s ease;
  }
  @keyframes modal-in{from{opacity:0;transform:scale(0.94) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .modal-lion { text-align:center; font-size:48px; margin-bottom:8px; filter:drop-shadow(0 0 16px rgba(201,168,76,0.4)); }
  .modal-logo {
    font-family: 'Cinzel', serif;
    font-size: 26px; font-weight: 700;
    color: var(--gold); letter-spacing: 6px;
    text-align: center; margin-bottom: 4px;
  }
  .modal-sub { text-align:center; font-size:10px; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; margin-bottom:28px; }
  .modal-field { margin-bottom: 14px; }
  .modal-label { display:block; font-size:10px; color:var(--text-dim); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:7px; }
  .modal-input {
    width:100%; background:var(--bg3); border:1px solid var(--border);
    border-radius:10px; padding:12px 14px; color:var(--text);
    font-family:'Inter',sans-serif; font-size:15px; outline:none;
    -webkit-appearance:none; transition:border-color 0.2s;
  }
  .modal-input:focus { border-color:var(--border-bright); }
  .modal-input::placeholder { color:var(--text-muted); }
  .modal-btn {
    width:100%; padding:14px;
    background:linear-gradient(135deg,#1e1a08,#332c10);
    border:1px solid var(--gold-dim); border-radius:10px;
    color:var(--gold); font-family:'Cinzel',serif; font-size:13px;
    font-weight:600; letter-spacing:3px; cursor:pointer;
    margin-top:8px; text-transform:uppercase; transition:all 0.25s;
    -webkit-appearance:none;
  }
  .modal-btn:active { border-color:var(--gold); background:linear-gradient(135deg,#2e2810,#453e18); }
  .modal-note { font-size:10px; color:var(--text-muted); text-align:center; margin-top:14px; line-height:1.6; }
  .modal-note a { color:var(--gold-dim); text-decoration:none; }

  /* ── LION WATERMARK ── */
  .lion-watermark {
    position: fixed;
    bottom: 120px; right: 16px;
    font-size: 64px;
    opacity: 0.04;
    pointer-events: none;
    z-index: 0;
    line-height: 1;
  }
</style>
</head>
<body>

<div class="glow-orb" id="glow-orb"></div>
<div class="lion-watermark">🦁</div>

<!-- MODAL -->
<div id="api-modal">
  <div class="modal-box">
    <div class="modal-lion">🦁</div>
    <div class="modal-logo">MAGNUS</div>
    <div class="modal-sub">Core Intelligence · Fase 1</div>
    <div class="modal-field">
      <label class="modal-label">Anthropic API Key</label>
      <input class="modal-input" type="password" id="api-key-input" placeholder="sk-ant-api03-..." autocomplete="off">
    </div>
    <div class="modal-field">
      <label class="modal-label">Tu nombre</label>
      <input class="modal-input" type="text" id="user-name-input" placeholder="David" value="David">
    </div>
    <button class="modal-btn" onclick="initMagnus()">⚡ Activar Magnus</button>
    <p class="modal-note">
      Tu key nunca sale de tu dispositivo.<br>
      <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>
    </p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-left">
      <span class="lion-icon">🦁</span>
      <div>
        <div class="logo">MAGNUS</div>
        <div class="logo-sub">Core Intelligence · Fase 1</div>
      </div>
    </div>
    <div class="status-bar">
      <div id="voice-wave">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div>
      </div>
      <div class="status-dot" id="status-dot"></div>
      <span class="status-label" id="status-label">Init</span>
    </div>
  </header>

  <div class="tools-strip">
    <div class="tool-pill connected" id="pill-claude"><div class="pill-dot"></div>Claude API</div>
    <div class="tool-pill" id="pill-gmail" onclick="checkGmail()"><div class="pill-dot"></div>Gmail</div>
    <div class="tool-pill" id="pill-calendar" onclick="checkCalendar()"><div class="pill-dot"></div>Calendar</div>
    <div class="tool-pill" id="pill-drive" onclick="checkDrive()"><div class="pill-dot"></div>Drive</div>
    <div class="tool-pill" id="pill-voice" onclick="toggleVoiceOutput()"><div class="pill-dot"></div>Voz</div>
  </div>

  <div id="chat-area"></div>

  <div id="input-bar">
    <div class="quick-actions">
      <button class="quick-btn" onclick="quickSend('¿Qué tengo en el calendario hoy?')">📅 Agenda</button>
      <button class="quick-btn" onclick="quickSend('¿Tengo correos importantes sin leer?')">📧 Correos</button>
      <button class="quick-btn" onclick="quickSend('Dame un resumen de mi día y qué priorizar')">⚡ Resumen</button>
      <button class="quick-btn" onclick="quickSend('¿Cómo van mis proyectos de Magnus Holding?')">🦁 Magnus</button>
      <button class="quick-btn" onclick="quickSend('Ayúdame a redactar algo importante')">✍️ Redactar</button>
    </div>
    <div class="input-row">
      <button class="btn-icon" id="btn-mic" onclick="toggleMic()">🎤</button>
      <textarea id="msg-input" placeholder="Habla con Magnus..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="btn-icon" id="btn-send" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<script>
let API_KEY = '';
let USER_NAME = 'David';
let conversation = [];
let isListening = false;
let voiceOutputEnabled = false;
let recognition = null;
let synth = window.speechSynthesis;

function buildSystemPrompt() {
  const now = new Date();
  const dateStr = now.toLocaleDateString('es-CO', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  const timeStr = now.toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
  return `Eres Magnus — asistente de inteligencia artificial personal de ${USER_NAME} Sotelo, emprendedor de Tunja, Boyacá, Colombia.

Fecha y hora: ${dateStr}, ${timeStr}

IDENTIDAD:
- Magnus: ejecutor veloz, estratégico, directo. Alter ego de ${USER_NAME}.
- Español latinoamericano natural. Conciso y profundo.
- Tono: socio estratégico de alto nivel, no asistente sumiso.

PERFIL DE ${USER_NAME.toUpperCase()}:
- 23 diplomados — formación excepcional para su edad
- Sexto semestre Ingeniería de Sistemas
- Administrador de bases de datos, Maestría en Educación — Juan de Castellanos, Tunja
- Desarrollador de IAs — construye soluciones reales
- Fundador Magnus Holding — holding empresarial en Boyacá
- Proyectos: GeoProject (topografía familiar), Marketing de Reprogramación Suave
- Filosofía: "old money", planificación estratégica, ejecución rápida

VISIÓN:
- Primer millonario de su familia
- Negocios escalables en Boyacá
- Aparecer en medios regionales y nacionales
- Referente tech y empresarial en Colombia
- Red de aliados serios en la región

INSTRUCCIÓN CLAVE:
Evalúa siempre si una decisión acerca o aleja a ${USER_NAME} de sus metas. Si aleja, dilo. Si acerca, poténcialo. Eres su socio estratégico.

REGLAS:
1. Máximo 120 palabras por respuesta. Directo y de alto valor.
2. Sin listas largas ni headers. Habla como socio, no como consultor.
3. Si algo es urgente para Magnus Holding, márcalo.
4. Proactivo: si ves algo importante, dilo.
5. NUNCA genérico. Siempre Magnus hablando con ${USER_NAME}.`;
}

function initMagnus() {
  const key = document.getElementById('api-key-input').value.trim();
  const name = document.getElementById('user-name-input').value.trim();
  if (!key.startsWith('sk-ant')) { alert('API key inválida.'); return; }
  API_KEY = key;
  USER_NAME = name || 'David';
  document.getElementById('api-modal').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  setStatus('online', 'En línea');
  document.getElementById('glow-orb').classList.add('active');
  setupVoiceRecognition();
  setTimeout(() => {
    addMagnusMessage(`Sistema activado, ${USER_NAME}. 🦁\n\nEstoy conectado y listo. ¿Por dónde empezamos?`);
  }, 400);
}

function setStatus(state, label) {
  document.getElementById('status-dot').className = 'status-dot ' + state;
  document.getElementById('status-label').textContent = label;
}

function addMagnusMessage(text) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg magnus';
  div.innerHTML = `
    <div class="msg-avatar">🦁</div>
    <div class="msg-content">
      <div class="msg-label">Magnus</div>
      <div class="msg-bubble">${escapeHtml(text).replace(/\n/g,'<br>')}</div>
    </div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  if (voiceOutputEnabled) speak(text);
}

function addUserMessage(text) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `
    <div class="msg-content">
      <div class="msg-label">${USER_NAME}</div>
      <div class="msg-bubble">${escapeHtml(text).replace(/\n/g,'<br>')}</div>
    </div>
    <div class="msg-avatar">${USER_NAME.slice(0,2).toUpperCase()}</div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function addTypingIndicator() {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg magnus typing-indicator';
  div.id = 'typing-ind';
  div.innerHTML = `
    <div class="msg-avatar">🦁</div>
    <div class="msg-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-ind');
  if (el) el.remove();
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !API_KEY) return;
  input.value = '';
  autoResize(input);
  addUserMessage(text);
  conversation.push({ role: 'user', content: text });
  addTypingIndicator();
  setStatus('listening', 'Pensando...');
  try {
    const response = await callClaude();
    removeTypingIndicator();
    addMagnusMessage(response);
    conversation.push({ role: 'assistant', content: response });
  } catch (e) {
    removeTypingIndicator();
    addMagnusMessage('Error: ' + e.message);
  }
  setStatus('online', 'En línea');
}

function quickSend(text) {
  document.getElementById('msg-input').value = text;
  sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

async function callClaude() {
  const body = {
    model: 'claude-sonnet-4-5',
    max_tokens: 1000,
    system: buildSystemPrompt(),
    messages: conversation
  };
  const res = await fetch('/api/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': API_KEY,
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error?.message || 'API error ' + res.status);
  }
  const data = await res.json();
  return data.content.filter(b => b.type === 'text').map(b => b.text).join('\n') || '…';
}

function markToolConnected(id) {
  const pill = document.getElementById(id);
  if (pill) pill.classList.add('connected');
}

function checkGmail() {
  markToolConnected('pill-gmail');
  quickSend('Revisa mis correos de Gmail — dame solo los urgentes o importantes de las últimas 24 horas');
}
function checkCalendar() {
  markToolConnected('pill-calendar');
  quickSend('Revisa mi Google Calendar — ¿qué tengo hoy y mañana?');
}
function checkDrive() {
  markToolConnected('pill-drive');
  quickSend('Revisa mis archivos recientes en Google Drive');
}

function setupVoiceRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  recognition = new SR();
  recognition.lang = 'es-CO';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = () => {
    setStatus('listening', 'Escuchando...');
    document.getElementById('voice-wave').classList.add('show');
    document.getElementById('btn-mic').classList.add('active');
  };
  recognition.onresult = (e) => {
    const t = e.results[0][0].transcript;
    document.getElementById('msg-input').value = t;
    autoResize(document.getElementById('msg-input'));
    sendMessage();
  };
  recognition.onend = recognition.onerror = () => {
    isListening = false;
    setStatus('online', 'En línea');
    document.getElementById('voice-wave').classList.remove('show');
    document.getElementById('btn-mic').classList.remove('active');
  };
}

function toggleMic() {
  if (!recognition) { addMagnusMessage('Tu navegador no soporta voz. Usa Chrome.'); return; }
  if (isListening) { recognition.stop(); isListening = false; }
  else { recognition.start(); isListening = true; }
}

function speak(text) {
  if (!synth) return;
  synth.cancel();
  const utt = new SpeechSynthesisUtterance(text.replace(/[*_#`]/g,'').slice(0,500));
  utt.lang = 'es-ES'; utt.rate = 0.95; utt.pitch = 0.9;
  synth.speak(utt);
}

function toggleVoiceOutput() {
  voiceOutputEnabled = !voiceOutputEnabled;
  const pill = document.getElementById('pill-voice');
  pill.classList.toggle('connected', voiceOutputEnabled);
  pill.innerHTML = `<div class="pill-dot"></div>Voz${voiceOutputEnabled ? ' ✓' : ''}`;
}

// Fix mobile keyboard pushing layout
function fixMobileLayout() {
  const area = document.getElementById('chat-area');
  if (area) area.scrollTop = area.scrollHeight;
}
window.addEventListener('resize', fixMobileLayout);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    document.getElementById('app').style.height = window.visualViewport.height + 'px';
    fixMobileLayout();
  });
}
</script>
