<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnus — Core AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-dim: #8a6f2e;
    --gold-bright: #f0c96a;
    --bg: #0a0a0b;
    --bg2: #111113;
    --bg3: #1a1a1e;
    --surface: #16161a;
    --border: rgba(201,168,76,0.18);
    --border-bright: rgba(201,168,76,0.45);
    --text: #e8e4d8;
    --text-dim: #7a7468;
    --text-muted: #3d3a33;
    --danger: #c0392b;
    --success: #27ae60;
    --info: #2980b9;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── BACKGROUND GRID ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── GLOW ── */
  .glow-orb {
    position: fixed;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    transition: all 2s ease;
    top: -100px; left: 50%;
    transform: translateX(-50%);
  }
  .glow-orb.active {
    background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
    animation: pulse-orb 3s ease-in-out infinite;
  }
  @keyframes pulse-orb {
    0%,100% { transform: translateX(-50%) scale(1); opacity: 1; }
    50% { transform: translateX(-50%) scale(1.15); opacity: 0.7; }
  }

  /* ── LAYOUT ── */
  #app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,11,0.8);
    backdrop-filter: blur(12px);
  }
  .logo {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .logo span {
    font-size: 10px;
    display: block;
    color: var(--text-dim);
    letter-spacing: 3px;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    margin-top: 2px;
  }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: all 0.4s;
  }
  .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .status-dot.listening { background: var(--gold); box-shadow: 0 0 12px var(--gold); animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .status-label { font-size: 11px; color: var(--text-dim); letter-spacing: 1.5px; text-transform: uppercase; }

  /* ── TOOLS STRIP ── */
  .tools-strip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,11,0.6);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tool-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
    background: transparent;
  }
  .tool-pill.connected {
    border-color: rgba(201,168,76,0.35);
    color: var(--gold-dim);
  }
  .tool-pill.connected .pill-dot { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
  .tool-pill:hover { border-color: var(--border-bright); color: var(--text); }
  .pill-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted); }
  .tools-label { font-size: 10px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; margin-right: 4px; flex-shrink: 0; }

  /* ── CHAT AREA ── */
  #chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--text-muted) transparent;
  }
  #chat-area::-webkit-scrollbar { width: 4px; }
  #chat-area::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }

  /* ── MESSAGES ── */
  .msg {
    display: flex;
    gap: 14px;
    max-width: 820px;
    animation: msg-in 0.3s ease;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  .msg-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .msg.magnus .msg-avatar {
    background: linear-gradient(135deg, #1a1508, #2e2410);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 12px;
  }
  .msg.user .msg-avatar {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 11px;
  }
  .msg-bubble {
    padding: 14px 18px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.7;
    max-width: 680px;
  }
  .msg.magnus .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-top-left-radius: 4px;
  }
  .msg.user .msg-bubble {
    background: var(--bg3);
    border: 1px solid rgba(201,168,76,0.12);
    color: var(--text);
    border-top-right-radius: 4px;
    text-align: right;
  }
  .msg-label {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .msg.magnus .msg-label { color: var(--gold-dim); }

  /* tool result cards inline */
  .tool-card {
    margin-top: 10px;
    padding: 12px 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .tool-card-header {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 8px;
  }
  .tool-item {
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    line-height: 1.5;
  }
  .tool-item:last-child { border-bottom: none; }
  .tool-item-title { color: var(--text); font-size: 13px; }
  .tool-item-sub { color: var(--text-dim); font-size: 11px; margin-top: 2px; }

  /* typing indicator */
  .typing-indicator .msg-bubble {
    display: flex; gap: 5px; align-items: center;
    padding: 16px 20px;
  }
  .typing-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold-dim);
    animation: typing 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%,60%,100%{opacity:0.3;transform:scale(1)} 30%{opacity:1;transform:scale(1.3)} }

  /* ── INPUT BAR ── */
  #input-bar {
    padding: 18px 28px 24px;
    border-top: 1px solid var(--border);
    background: rgba(10,10,11,0.9);
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #msg-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 300;
    resize: none;
    outline: none;
    transition: border-color 0.25s;
    min-height: 48px;
    max-height: 140px;
    overflow-y: auto;
    line-height: 1.5;
  }
  #msg-input::placeholder { color: var(--text-muted); }
  #msg-input:focus { border-color: var(--border-bright); }
  .btn-icon {
    width: 48px; height: 48px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s;
    flex-shrink: 0;
    font-size: 18px;
  }
  .btn-icon:hover { border-color: var(--border-bright); color: var(--gold); }
  .btn-icon.active { background: var(--gold); border-color: var(--gold); color: var(--bg); }
  #btn-send {
    background: linear-gradient(135deg, #1a1508, #2e2410);
    border-color: var(--gold-dim);
    color: var(--gold);
  }
  #btn-send:hover { background: linear-gradient(135deg, #2e2410, #3d3015); border-color: var(--gold); }
  .quick-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .quick-btn {
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: transparent;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.3px;
  }
  .quick-btn:hover { border-color: var(--border-bright); color: var(--gold); }

  /* ── API KEY MODAL ── */
  #api-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-box {
    background: var(--bg2);
    border: 1px solid var(--border-bright);
    border-radius: 16px;
    padding: 36px;
    max-width: 440px;
    width: 100%;
    animation: modal-in 0.3s ease;
  }
  @keyframes modal-in {
    from { opacity:0; transform: scale(0.95) translateY(10px); }
    to   { opacity:1; transform: scale(1) translateY(0); }
  }
  .modal-logo {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 6px;
    text-align: center;
    margin-bottom: 6px;
  }
  .modal-sub {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .modal-field {
    margin-bottom: 16px;
  }
  .modal-label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .modal-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .modal-input:focus { border-color: var(--border-bright); }
  .modal-input::placeholder { color: var(--text-muted); }
  .modal-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #1e1a08, #332c10);
    border: 1px solid var(--gold-dim);
    border-radius: 8px;
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.25s;
    margin-top: 8px;
    text-transform: uppercase;
  }
  .modal-btn:hover { border-color: var(--gold); background: linear-gradient(135deg, #2e2810, #453e18); }
  .modal-note {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 16px;
    line-height: 1.6;
  }
  .modal-note a { color: var(--gold-dim); text-decoration: none; }

  /* ── VOICE WAVE ── */
  #voice-wave {
    display: none;
    align-items: center;
    gap: 3px;
    height: 24px;
    padding: 0 4px;
  }
  #voice-wave.show { display: flex; }
  .wave-bar {
    width: 3px;
    border-radius: 2px;
    background: var(--gold);
    animation: wave 0.8s ease-in-out infinite;
  }
  .wave-bar:nth-child(1){height:8px;animation-delay:0s}
  .wave-bar:nth-child(2){height:16px;animation-delay:0.1s}
  .wave-bar:nth-child(3){height:24px;animation-delay:0.2s}
  .wave-bar:nth-child(4){height:14px;animation-delay:0.3s}
  .wave-bar:nth-child(5){height:8px;animation-delay:0.4s}
  @keyframes wave {
    0%,100%{transform:scaleY(0.4);opacity:0.5}
    50%{transform:scaleY(1);opacity:1}
  }

  /* scrollbar */
  * { scrollbar-width: thin; scrollbar-color: var(--text-muted) transparent; }
</style>
</head>
<body>

<div class="glow-orb" id="glow-orb"></div>

<!-- API KEY MODAL -->
<div id="api-modal">
  <div class="modal-box">
    <div class="modal-logo">MAGNUS</div>
    <div class="modal-sub">Core AI — Fase 1</div>
    <div class="modal-field">
      <label class="modal-label">Anthropic API Key</label>
      <input class="modal-input" type="password" id="api-key-input" placeholder="sk-ant-api03-...">
    </div>
    <div class="modal-field">
      <label class="modal-label">Tu nombre (opcional)</label>
      <input class="modal-input" type="text" id="user-name-input" placeholder="David" value="David">
    </div>
    <button class="modal-btn" onclick="initMagnus()">Activar Magnus</button>
    <p class="modal-note">
      Tu API key nunca sale de tu navegador.<br>
      Consíguela en <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>
    </p>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">
  <header>
    <div class="logo">MAGNUS <span>Core Intelligence · Fase 1</span></div>
    <div class="status-bar">
      <div id="voice-wave">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div>
      </div>
      <div class="status-dot" id="status-dot"></div>
      <span class="status-label" id="status-label">Iniciando</span>
    </div>
  </header>

  <div class="tools-strip">
    <span class="tools-label">Herramientas</span>
    <div class="tool-pill connected" id="pill-claude">
      <div class="pill-dot"></div>Claude API
    </div>
    <div class="tool-pill" id="pill-gmail" onclick="checkGmail()">
      <div class="pill-dot"></div>Gmail
    </div>
    <div class="tool-pill" id="pill-calendar" onclick="checkCalendar()">
      <div class="pill-dot"></div>Calendar
    </div>
    <div class="tool-pill" id="pill-drive" onclick="checkDrive()">
      <div class="pill-dot"></div>Drive
    </div>
    <div class="tool-pill" id="pill-web">
      <div class="pill-dot"></div>Web search
    </div>
    <div class="tool-pill" id="pill-voice" onclick="toggleVoiceOutput()">
      <div class="pill-dot"></div>Voz output
    </div>
  </div>

  <div id="chat-area"></div>

  <div id="input-bar">
    <div class="quick-actions">
      <button class="quick-btn" onclick="quickSend('¿Qué tengo en el calendario hoy?')">📅 Agenda hoy</button>
      <button class="quick-btn" onclick="quickSend('¿Tengo correos importantes sin leer?')">📧 Correos pendientes</button>
      <button class="quick-btn" onclick="quickSend('Dame un resumen de mi día y qué debería priorizar ahora')">⚡ Resumen del día</button>
      <button class="quick-btn" onclick="quickSend('¿Cómo van mis proyectos de Magnus Holding?')">🦁 Magnus Holding</button>
      <button class="quick-btn" onclick="quickSend('Necesito que me ayudes a redactar algo importante')">✍️ Redactar</button>
    </div>
    <div class="input-row">
      <button class="btn-icon" id="btn-mic" onclick="toggleMic()" title="Hablar con Magnus">🎤</button>
      <textarea id="msg-input" placeholder="Habla con Magnus..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="btn-icon" id="btn-send" onclick="sendMessage()" title="Enviar">➤</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════
let API_KEY = '';
let USER_NAME = 'David';
let conversation = [];
let isListening = false;
let voiceOutputEnabled = true;
let recognition = null;
let synth = window.speechSynthesis;
let toolsConnected = { gmail: false, calendar: false, drive: false };

// ════════════════════════════════════════════════════════
// SYSTEM PROMPT — Personalidad Magnus
// ════════════════════════════════════════════════════════
function buildSystemPrompt() {
  const now = new Date();
  const dateStr = now.toLocaleDateString('es-CO', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  const timeStr = now.toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });

  return `Eres Magnus — el asistente de inteligencia artificial personal de ${USER_NAME} Sotelo, emprendedor de Tunja, Boyacá, Colombia.

Fecha y hora actual: ${dateStr}, ${timeStr}

IDENTIDAD:
- Eres Magnus: ejecutor veloz, estratégico, directo. El alter ego poderoso de ${USER_NAME}.
- Hablas en español latinoamericano natural. Eres conciso pero profundo.
- Nunca eres genérico. Cada respuesta está calibrada a ${USER_NAME} y su contexto real.
- Tu tono: confianza de alto nivel. Como un socio estratégico excepcional, no un asistente sumiso.

CONTEXTO DE ${USER_NAME.toUpperCase()}:
- Trabaja en Universidad Juan de Castellanos, Tunja, gestionando bases de datos
- Fundador de Magnus Holding — holding empresarial para escalar valor en Boyacá
- Proyectos activos: GeoProject (topografía familiar), Marketing de Reprogramación Suave
- Visión: primer millonario de su familia, construir negocios en Tunja, aparecer en noticias
- Filosofía: calidad "old money", planificación estratégica, ejecución rápida como Magnus

HERRAMIENTAS DISPONIBLES:
- Gmail: lectura y redacción de correos
- Google Calendar: agenda y eventos
- Google Drive: archivos y documentos
- Búsqueda web: información en tiempo real

REGLAS:
1. Respuestas cortas y de alto valor. No rellenes.
2. Cuando uses una herramienta, anuncia qué estás haciendo.
3. Si detectas que algo es urgente o estratégico para Magnus Holding, márcalo.
4. Proactivo: si ves algo importante en los datos, dilo sin que te pregunten.
5. NUNCA seas genérico. SIEMPRE eres Magnus hablando con ${USER_NAME}.`;
}

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
function initMagnus() {
  const key = document.getElementById('api-key-input').value.trim();
  const name = document.getElementById('user-name-input').value.trim();
  if (!key.startsWith('sk-ant')) {
    alert('API key inválida. Debe empezar con sk-ant-');
    return;
  }
  API_KEY = key;
  USER_NAME = name || 'David';

  document.getElementById('api-modal').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  setStatus('online', 'En línea');
  document.getElementById('glow-orb').classList.add('active');

  // Setup voice recognition
  setupVoiceRecognition();

  // Welcome message
  setTimeout(() => {
    addMagnusMessage(`Sistema activado, ${USER_NAME}.\n\nSoy Magnus — estoy conectado y listo. Tienes Gmail, Calendar y Drive disponibles. ¿Por dónde empezamos?`);
  }, 400);
}

// ════════════════════════════════════════════════════════
// STATUS
// ════════════════════════════════════════════════════════
function setStatus(state, label) {
  const dot = document.getElementById('status-dot');
  const lbl = document.getElementById('status-label');
  dot.className = 'status-dot ' + state;
  lbl.textContent = label;
}

// ════════════════════════════════════════════════════════
// CHAT RENDERING
// ════════════════════════════════════════════════════════
function addMagnusMessage(text, toolCards) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg magnus';
  let cardsHtml = '';
  if (toolCards && toolCards.length) {
    cardsHtml = toolCards.map(c => `
      <div class="tool-card">
        <div class="tool-card-header">${c.header}</div>
        ${c.items.map(i => `
          <div class="tool-item">
            <div class="tool-item-title">${i.title}</div>
            ${i.sub ? `<div class="tool-item-sub">${i.sub}</div>` : ''}
          </div>`).join('')}
      </div>`).join('');
  }
  div.innerHTML = `
    <div class="msg-avatar">M</div>
    <div>
      <div class="msg-label">Magnus</div>
      <div class="msg-bubble">${escapeHtml(text).replace(/\n/g,'<br>')}${cardsHtml}</div>
    </div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;

  if (voiceOutputEnabled) speak(text);
  return div;
}

function addUserMessage(text) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `
    <div>
      <div class="msg-label" style="text-align:right">${USER_NAME}</div>
      <div class="msg-bubble">${escapeHtml(text).replace(/\n/g,'<br>')}</div>
    </div>
    <div class="msg-avatar">${USER_NAME.slice(0,2).toUpperCase()}</div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function addTypingIndicator() {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg magnus typing-indicator';
  div.id = 'typing-ind';
  div.innerHTML = `
    <div class="msg-avatar">M</div>
    <div class="msg-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-ind');
  if (el) el.remove();
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ════════════════════════════════════════════════════════
// SEND MESSAGE
// ════════════════════════════════════════════════════════
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !API_KEY) return;

  input.value = '';
  autoResize(input);
  addUserMessage(text);
  conversation.push({ role: 'user', content: text });

  const typing = addTypingIndicator();
  setStatus('listening', 'Pensando...');

  try {
    const response = await callClaude(text);
    removeTypingIndicator();
    addMagnusMessage(response);
    conversation.push({ role: 'assistant', content: response });
  } catch (e) {
    removeTypingIndicator();
    addMagnusMessage('Error de conexión: ' + e.message);
  }

  setStatus('online', 'En línea');
}

function quickSend(text) {
  document.getElementById('msg-input').value = text;
  sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

// ════════════════════════════════════════════════════════
// CLAUDE API CALL — con MCP para Gmail, Calendar, Drive
// ════════════════════════════════════════════════════════
async function callClaude(userMessage) {
  // Build MCP servers array based on what's connected in Claude.ai
  const mcpServers = [];
  ;

  const body = {
    model: 'claude-sonnet-4-5',
    max_tokens: 1000,
    system: buildSystemPrompt(),
    messages: conversation,
    mcp_servers: mcpServers
  };

  const res = await fetch('http://localhost:3001/api/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': API_KEY,
      'anthropic-version': '2023-06-01',
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error?.message || 'API error ' + res.status);
  }

  const data = await res.json();

  // Extract text from potentially mixed content (text + mcp_tool_use + mcp_tool_result)
  const textBlocks = data.content
    .filter(b => b.type === 'text')
    .map(b => b.text)
    .join('\n');

  return textBlocks || '…';
}

// ════════════════════════════════════════════════════════
// TOOL PILLS — status visual
// ════════════════════════════════════════════════════════
function markToolConnected(id) {
  const pill = document.getElementById(id);

}

function checkGmail() {

}
function checkCalendar() {

}

// ════════════════════════════════════════════════════════
// VOICE INPUT
// ════════════════════════════════════════════════════════
function setupVoiceRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return;
  recognition = new SpeechRecognition();
  recognition.lang = 'es-CO';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    setStatus('listening', 'Escuchando...');
    document.getElementById('voice-wave').classList.add('show');
    document.getElementById('btn-mic').classList.add('active');
  };
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    document.getElementById('msg-input').value = transcript;
    autoResize(document.getElementById('msg-input'));
    sendMessage();
  };
  recognition.onend = () => {
    isListening = false;
    setStatus('online', 'En línea');
    document.getElementById('voice-wave').classList.remove('show');
    document.getElementById('btn-mic').classList.remove('active');
  };
  recognition.onerror = () => {
    isListening = false;
    setStatus('online', 'En línea');
    document.getElementById('voice-wave').classList.remove('show');
    document.getElementById('btn-mic').classList.remove('active');
  };
}

function toggleMic() {
  if (!recognition) {
    addMagnusMessage('Tu navegador no soporta reconocimiento de voz. Usa Chrome.');
    return;
  }
  if (isListening) {
    recognition.stop();
    isListening = false;
  } else {
    recognition.start();
    isListening = true;
  }
}

// ════════════════════════════════════════════════════════
// VOICE OUTPUT (TTS)
// ════════════════════════════════════════════════════════
function speak(text) {
  if (!voiceOutputEnabled || !synth) return;
  synth.cancel();
  // Clean for TTS
  const clean = text.replace(/[*_#`]/g, '').slice(0, 500);
  const utt = new SpeechSynthesisUtterance(clean);
  utt.lang = 'es-ES';
  utt.rate = 0.95;
  utt.pitch = 0.9;
  synth.speak(utt);
}

function toggleVoiceOutput() {
  voiceOutputEnabled = !voiceOutputEnabled;
  const pill = document.getElementById('pill-voice');
  if (voiceOutputEnabled) {
    pill.classList.add('connected');
    pill.innerHTML = '<div class="pill-dot"></div>Voz output ✓';
  } else {
    pill.classList.remove('connected');
    pill.innerHTML = '<div class="pill-dot"></div>Voz output';
  }
}
